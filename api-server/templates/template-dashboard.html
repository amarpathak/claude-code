<!DOCTYPE html>
<html>
<head>
  <title>Template Management Dashboard</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #6b7280;
      color: white;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
    .btn-danger {
      background: #dc2626;
      color: white;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }
    .section {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 30px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #1f2937;
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .filter-group label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }
    select, input[type="text"], input[type="number"], textarea {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      font-family: inherit;
      resize: vertical;
    }
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .template-card {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .template-card:hover {
      border-color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }
    .template-card.inactive {
      opacity: 0.6;
    }
    .template-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }
    .template-name {
      font-size: 1.2em;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .template-type {
      display: inline-block;
      padding: 4px 10px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .template-description {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .template-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }
    .template-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      background: #f3f4f6;
      border-radius: 12px;
      font-size: 11px;
      color: #6b7280;
      margin-right: 4px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
      justify-content: center;
      align-items: start;
      padding: 40px 20px;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 1.8em;
      color: #1f2937;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6b7280;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #374151;
    }
    .form-group small {
      display: block;
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .section-list {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .section-item {
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .section-item:last-child {
      margin-bottom: 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #f9fafb;
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #4f46e5;
    }
    .stat-value {
      font-size: 2em;
      font-weight: 700;
      color: #1f2937;
    }
    .stat-label {
      color: #6b7280;
      font-size: 14px;
      margin-top: 5px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }
    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 Template Management</h1>
      <button class="btn btn-primary" onclick="showCreateModal()">+ Create Template</button>
    </div>

    <!-- Statistics -->
    <div class="section">
      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total Templates</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-active">0</div>
          <div class="stat-label">Active Templates</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-usage">0</div>
          <div class="stat-label">Total Usage</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="section">
      <div class="filters">
        <div class="filter-group">
          <label>Type</label>
          <select id="filter-type" onchange="loadTemplates()">
            <option value="">All Types</option>
            <option value="love">Love</option>
            <option value="money">Money</option>
            <option value="career">Career</option>
            <option value="health">Health</option>
            <option value="spiritual">Spiritual</option>
            <option value="general">General</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Category</label>
          <select id="filter-category" onchange="loadTemplates()">
            <option value="">All Categories</option>
            <option value="blueprint">Blueprint</option>
            <option value="report">Report</option>
            <option value="analysis">Analysis</option>
            <option value="guide">Guide</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Status</label>
          <select id="filter-status" onchange="loadTemplates()">
            <option value="">All</option>
            <option value="active">Active Only</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Templates Grid -->
    <div class="section">
      <h2 class="section-title">Templates</h2>
      <div id="templates-container" class="loading">
        Loading templates...
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="template-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Create Template</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="template-form" onsubmit="saveTemplate(event)">
        <input type="hidden" id="template-id" name="id">

        <div class="form-row">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" id="template-name" name="name" required>
            <small>Display name for the template</small>
          </div>
          <div class="form-group">
            <label>Type *</label>
            <select id="template-type" name="type" required>
              <option value="love">Love & Relationships</option>
              <option value="money">Money & Wealth</option>
              <option value="career">Career & Purpose</option>
              <option value="health">Health & Wellness</option>
              <option value="spiritual">Spiritual Path</option>
              <option value="general">General</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Category *</label>
            <select id="template-category" name="category" required>
              <option value="blueprint">Blueprint</option>
              <option value="report">Report</option>
              <option value="analysis">Analysis</option>
              <option value="guide">Guide</option>
              <option value="reading">Reading</option>
            </select>
          </div>
          <div class="form-group">
            <label>Word Count</label>
            <input type="number" id="template-wordcount" name="word_count" value="1500" min="100">
            <small>Target word count for generated content</small>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="template-description" name="description" rows="3"></textarea>
          <small>What does this template do?</small>
        </div>

        <div class="form-group">
          <label>Tags (comma-separated)</label>
          <input type="text" id="template-tags" name="tags" placeholder="astrology, blueprint, love">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 30px;">
          <button type="submit" class="btn btn-primary">Save Template</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Modal -->
  <div id="view-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="view-modal-title">Template Details</h2>
        <button class="close-btn" onclick="closeViewModal()">&times;</button>
      </div>
      <div id="view-modal-content"></div>
    </div>
  </div>

  <script>
    let templates = [];
    let currentTemplate = null;
    const API_BASE = '/api';

    // Load API key from localStorage or prompt
    let API_KEY = localStorage.getItem('api_key');
    if (!API_KEY) {
      API_KEY = prompt('Please enter your API key:');
      if (API_KEY) {
        localStorage.setItem('api_key', API_KEY);
      }
    }

    // API helper
    async function apiCall(endpoint, options = {}) {
      const response = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': API_KEY,
          ...options.headers
        }
      });

      if (!response.ok) {
        if (response.status === 401) {
          localStorage.removeItem('api_key');
          alert('Invalid API key. Please refresh and enter a valid key.');
        }
        throw new Error(`API error: ${response.statusText}`);
      }

      return response.json();
    }

    // Load templates
    async function loadTemplates() {
      try {
        const type = document.getElementById('filter-type').value;
        const category = document.getElementById('filter-category').value;
        const status = document.getElementById('filter-status').value;

        let query = '/templates?';
        if (type) query += `type=${type}&`;
        if (category) query += `category=${category}&`;
        if (status === 'active') query += 'active_only=true&';

        const data = await apiCall(query);
        templates = data.templates || [];

        updateStats();
        renderTemplates();
      } catch (error) {
        console.error('Error loading templates:', error);
        document.getElementById('templates-container').innerHTML =
          `<div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>Error loading templates: ${error.message}</p>
          </div>`;
      }
    }

    // Update statistics
    function updateStats() {
      const total = templates.length;
      const active = templates.filter(t => t.is_active !== false).length;
      const usage = templates.reduce((sum, t) => sum + (t.usage_count || 0), 0);

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-usage').textContent = usage;
    }

    // Render templates
    function renderTemplates() {
      const container = document.getElementById('templates-container');

      if (templates.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p>No templates found. Create your first template!</p>
          </div>`;
        return;
      }

      container.innerHTML = `<div class="template-grid">${templates.map(template => `
        <div class="template-card ${template.is_active === false ? 'inactive' : ''}"
             onclick="viewTemplate('${template.id}')">
          <div class="template-header">
            <div>
              <div class="template-name">${template.name}</div>
              <span class="template-type">${template.type}</span>
            </div>
          </div>
          <div class="template-description">
            ${template.description || 'No description'}
          </div>
          <div>
            ${(template.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <div class="template-meta">
            <span>Used ${template.usage_count || 0} times</span>
            <span>v${template.version || '1.0.0'}</span>
          </div>
          <div class="template-actions">
            <button class="btn btn-primary btn-small" onclick="editTemplate('${template.id}', event)">Edit</button>
            <button class="btn btn-secondary btn-small" onclick="duplicateTemplate('${template.id}', event)">Duplicate</button>
            <button class="btn btn-danger btn-small" onclick="deleteTemplate('${template.id}', event)">Delete</button>
          </div>
        </div>
      `).join('')}</div>`;
    }

    // View template details
    async function viewTemplate(id) {
      try {
        const data = await apiCall(`/templates/${id}`);
        const template = data.template;

        const content = `
          <div style="line-height: 1.8;">
            <p><strong>Type:</strong> ${template.type}</p>
            <p><strong>Category:</strong> ${template.category}</p>
            <p><strong>Description:</strong> ${template.description || 'N/A'}</p>
            <p><strong>Word Count:</strong> ${template.structure?.word_count || 0}</p>
            <p><strong>Sections:</strong> ${template.structure?.sections?.length || 0}</p>
            <p><strong>Follow-up Questions:</strong> ${template.follow_up_questions?.length || 0}</p>
            <p><strong>Tags:</strong> ${(template.metadata?.tags || []).join(', ') || 'None'}</p>
            <p><strong>Usage Count:</strong> ${template.metadata?.usage_count || 0}</p>
            <p><strong>Created:</strong> ${new Date(template.metadata?.created_at).toLocaleString()}</p>
            <p><strong>Updated:</strong> ${new Date(template.metadata?.updated_at).toLocaleString()}</p>
          </div>
        `;

        document.getElementById('view-modal-title').textContent = template.name;
        document.getElementById('view-modal-content').innerHTML = content;
        document.getElementById('view-modal').classList.add('active');
      } catch (error) {
        alert(`Error loading template: ${error.message}`);
      }
    }

    // Show create modal
    function showCreateModal() {
      currentTemplate = null;
      document.getElementById('modal-title').textContent = 'Create Template';
      document.getElementById('template-form').reset();
      document.getElementById('template-id').value = '';
      document.getElementById('template-modal').classList.add('active');
    }

    // Edit template
    async function editTemplate(id, event) {
      event.stopPropagation();

      try {
        const data = await apiCall(`/templates/${id}`);
        currentTemplate = data.template;

        document.getElementById('modal-title').textContent = 'Edit Template';
        document.getElementById('template-id').value = currentTemplate.id;
        document.getElementById('template-name').value = currentTemplate.name;
        document.getElementById('template-type').value = currentTemplate.type;
        document.getElementById('template-category').value = currentTemplate.category;
        document.getElementById('template-wordcount').value = currentTemplate.structure?.word_count || 1500;
        document.getElementById('template-description').value = currentTemplate.description || '';
        document.getElementById('template-tags').value = (currentTemplate.metadata?.tags || []).join(', ');

        document.getElementById('template-modal').classList.add('active');
      } catch (error) {
        alert(`Error loading template: ${error.message}`);
      }
    }

    // Save template
    async function saveTemplate(event) {
      event.preventDefault();

      const formData = new FormData(event.target);
      const templateId = formData.get('id');
      const tags = formData.get('tags').split(',').map(t => t.trim()).filter(Boolean);

      const templateData = {
        name: formData.get('name'),
        type: formData.get('type'),
        category: formData.get('category'),
        description: formData.get('description'),
        structure: {
          word_count: parseInt(formData.get('word_count')) || 1500,
          sections: currentTemplate?.structure?.sections || []
        },
        metadata: {
          tags: tags
        }
      };

      try {
        if (templateId) {
          // Update existing
          await apiCall(`/templates/${templateId}`, {
            method: 'PUT',
            body: JSON.stringify(templateData)
          });
        } else {
          // Create new
          await apiCall('/templates', {
            method: 'POST',
            body: JSON.stringify(templateData)
          });
        }

        closeModal();
        loadTemplates();
      } catch (error) {
        alert(`Error saving template: ${error.message}`);
      }
    }

    // Duplicate template
    async function duplicateTemplate(id, event) {
      event.stopPropagation();

      const name = prompt('Enter name for the duplicate:');
      if (!name) return;

      try {
        await apiCall(`/templates/${id}/duplicate`, {
          method: 'POST',
          body: JSON.stringify({ name })
        });

        loadTemplates();
      } catch (error) {
        alert(`Error duplicating template: ${error.message}`);
      }
    }

    // Delete template
    async function deleteTemplate(id, event) {
      event.stopPropagation();

      if (!confirm('Are you sure you want to deactivate this template?')) return;

      try {
        await apiCall(`/templates/${id}`, {
          method: 'DELETE'
        });

        loadTemplates();
      } catch (error) {
        alert(`Error deleting template: ${error.message}`);
      }
    }

    // Close modals
    function closeModal() {
      document.getElementById('template-modal').classList.remove('active');
    }

    function closeViewModal() {
      document.getElementById('view-modal').classList.remove('active');
    }

    // Initialize
    loadTemplates();
  </script>
</body>
</html>
